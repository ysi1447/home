<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>해 뜨는 작은 별</title>
<link rel="stylesheet" href="style.css">

<canvas id="scene" aria-label="일출이 보이는 바다와 모래사장, 그 위에 떠 있는 작은 지구"></canvas>

<header class="brand">
  <h1>해 뜨는 작은 별</h1>
  <p>파도 소리를 들으며 잠시 쉬어 가세요</p>
</header>

<nav class="side-menu" aria-label="주 메뉴">
  <button type="button" data-open="board">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5z M8 8h8 M8 12h8 M8 16h5"/></svg>
    <span>게시판</span>
  </button>
  <button type="button" data-open="guest">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H10l-5 4v-4H4z M8 9h8 M8 12h5"/></svg>
    <span>방명록</span>
  </button>
</nav>

<div class="hud">
  <button type="button" id="btnSound" class="chip" aria-pressed="false">♪ 파도 소리 켜기</button>
  <button type="button" id="btnMode" class="chip" aria-pressed="true">AI 모드</button>
  <span class="hint">방향키 ← ↑ ↓ → 로 직접 이동 · 스페이스 점프 · 집 클릭 시 출입</span>
</div>

<div class="dpad" aria-label="이동 버튼">
  <button type="button" data-key="ArrowUp" class="up" aria-label="위">▲</button>
  <button type="button" data-key="ArrowLeft" class="left" aria-label="왼쪽">◀</button>
  <button type="button" data-key="Jump" class="mid" aria-label="점프">●</button>
  <button type="button" data-key="ArrowRight" class="right" aria-label="오른쪽">▶</button>
  <button type="button" data-key="ArrowDown" class="down" aria-label="아래">▼</button>
</div>

<aside class="panel" id="panel" aria-hidden="true" aria-label="게시판과 방명록">
  <div class="panel-head">
    <div class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="board" aria-selected="true">게시판</button>
      <button type="button" role="tab" data-tab="guest" aria-selected="false">방명록</button>
    </div>
    <button type="button" class="close" id="btnClose" aria-label="닫기">×</button>
  </div>

  <div class="panel-body">
    <p class="store-note" id="storeNote"></p>
    <section id="tab-board" role="tabpanel">
      <div id="boardList">
        <div class="toolbar">
          <span class="count" id="boardCount"></span>
          <button type="button" class="btn primary" id="btnWrite">글쓰기</button>
        </div>
        <ul class="post-list" id="postList"></ul>
      </div>

      <article id="boardDetail" hidden></article>

      <form id="boardForm" hidden autocomplete="off">
        <h2>새 글 쓰기</h2>
        <label>이름<input id="postAuthor" name="author" maxlength="20" required placeholder="이름을 적어 주세요"></label>
        <label>제목<input id="postTitle" name="title" maxlength="60" required placeholder="제목"></label>
        <label>내용<textarea id="postBody" name="body" rows="7" maxlength="3000" required placeholder="바다를 보며 떠오른 이야기를 남겨 주세요"></textarea></label>
        <div class="file-row">
          <label class="file-btn">사진 올리기<input id="postPhoto" type="file" name="photo" accept="image/*"></label>
          <span class="file-name">선택한 사진 없음</span>
        </div>
        <div class="preview" hidden><img alt="올릴 사진 미리보기"><button type="button" class="remove" aria-label="사진 빼기">×</button></div>
        <div class="form-actions">
          <button type="button" class="btn" id="btnCancel">취소</button>
          <button type="submit" class="btn primary">등록</button>
        </div>
      </form>
    </section>

    <section id="tab-guest" role="tabpanel" hidden>
      <form id="guestForm" autocomplete="off">
        <div class="guest-row">
          <input id="guestAuthor" name="author" maxlength="20" required placeholder="이름">
          <label class="file-btn small">사진<input id="guestPhoto" type="file" name="photo" accept="image/*"></label>
        </div>
        <textarea id="guestBody" name="body" rows="3" maxlength="500" required placeholder="다녀간 흔적을 남겨 주세요"></textarea>
        <div class="preview" hidden><img alt="올릴 사진 미리보기"><button type="button" class="remove" aria-label="사진 빼기">×</button></div>
        <div class="form-actions">
          <span class="count" id="guestCount"></span>
          <button type="submit" class="btn primary">남기기</button>
        </div>
      </form>
      <ul class="guest-list" id="guestList"></ul>
    </section>
  </div>
</aside>

<div class="lightbox" id="lightbox" hidden><img alt="크게 본 사진"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js" charset="utf-8"></script>

</body></html>
